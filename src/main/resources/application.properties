spring.application.name=aashray-backend

# Default active profile for local development; can be overridden by SPRING_PROFILES_ACTIVE environment variable
spring.profiles.active=local

# Common JPA and Flyway settings (shared across profiles)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.flyway.enabled=true

# Ingestion configuration defaults
aashray.ingestion.default-srid=4326
aashray.ingestion.max-batch-size=1000
aashray.ingestion.import-dir=data/imports
aashray.ingestion.strict-validation=true

